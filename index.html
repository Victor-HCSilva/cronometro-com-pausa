<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro de Intervalos</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <script src="assets/script.js" defer></script>
    <div class="container">
        <h1>Cronômetro Intervalo</h1>
        
        <div class="setup">
            <div class="input-group">
                <label>Repetições:</label>
                <input type="number" id="rounds" value="4" min="1">
            </div>
            <div class="input-group">
                <label>Trabalho (seg):</label>
                <input type="number" id="workTime" value="10" min="1">
            </div>
            <div class="input-group">
                <label>Pausa (seg):</label>
                <input type="number" id="restTime" value="5" min="0">
            </div>
        </div>

        <div class="display">
            <div id="status">Pronto?</div>
            <div id="timer">00:00</div>
            <div id="round-indicator">Rodada: 0 / 0</div>
        </div>

        <div class="controls">
            <button id="startBtn">Iniciar</button>
            <button id="resetBtn" class="reset">Resetar</button>
        </div>

        <div class="total-info">
            Tempo total estimado: <span id="totalEstimate">0</span>s
        </div>
    </div>

</body>
</html>
